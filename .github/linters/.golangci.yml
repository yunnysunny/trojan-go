version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - gocritic
    - govet
    - ineffassign
    - misspell
    - unconvert
    - whitespace
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/p4gefau1t/trojan-go)
    goimports:
      local-prefixes:
        - github.com/p4gefau1t/trojan-go
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$

issues:
  new: true
